<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Question | Entrance Exam System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .choice {
      padding: 12px 18px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-weight: 500;
      transition: all 0.3s;
    }
    .choice.correct {
      background-color: #d1fae5; /* green highlight */
      border-color: #10b981;
      font-weight: bold;
    }
  </style>
</head>
<body class="p-4">

  <div class="container">
    <h2 class="mb-4">View Question</h2>

    <div class="card mb-4">
      <div class="card-body">
        <h5>Subject: <span class="badge bg-primary">{{ question.subject }}</span></h5>
        <h5>Difficulty: <span class="badge bg-secondary">{{ question.difficulty }}</span></h5>
        <hr>
        <p class="fw-bold">{{ question.question_text }}</p>

        <div class="choices">
          <div class="choice {% if question.correct_option == 'A' %}correct{% endif %}">
            A. {{ question.choice_a }}
          </div>
          <div class="choice {% if question.correct_option == 'B' %}correct{% endif %}">
            B. {{ question.choice_b }}
          </div>
          <div class="choice {% if question.correct_option == 'C' %}correct{% endif %}">
            C. {{ question.choice_c }}
          </div>
          <div class="choice {% if question.correct_option == 'D' %}correct{% endif %}">
            D. {{ question.choice_d }}
          </div>
        </div>
      </div>
    </div>

    <a href="{{ url_for('admin_exam_set') }}" class="btn btn-secondary">Back to Questions</a>
  </div>

</body>
</html>
