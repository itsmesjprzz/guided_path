<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Global Reciprocal Colleges</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
    }

    .banner {
      background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
      color: white;
      padding: 3rem 4rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(185, 28, 28, 0.25);
      max-width: 700px;
      width: 90%;
    }

    .banner h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .banner p {
      font-size: 0.95rem;
      opacity: 0.85;
      margin: 0;
      letter-spacing: 0.08em;
    }

    .banner i {
      font-size: 2.5rem;
      color: #fcd34d;
      margin-bottom: 1rem;
      display: block;
    }
  </style>
</head>
<body>

  <div class="banner">
    <i class="fas fa-graduation-cap"></i>
    <h1>Thank You for Taking the College Entrance Exam!</h1>
    <p>Global Reciprocal Colleges &nbsp;·&nbsp; Office of Admissions &nbsp;·&nbsp; A.Y. 2025–2026</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
